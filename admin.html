<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body class="admin-page">


<nav class="navbar navbar-dark cricket-navbar">

    <div class="container">

        <span class="navbar-brand fw-bold">
            🏏 Admin Dashboard
        </span>

        <button
            id="logoutBtn"
            class="btn btn-outline-light btn-sm"
        >
            Logout
        </button>

    </div>

</nav>


<main class="container py-4">


    <div class="mb-4">

        <h2>
            Dashboard
        </h2>

        <p class="text-muted">
            Manage your cricket tournament
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="row g-3 mb-4">


        <div class="col-6 col-lg-3">

            <div class="stat-card">

                <i class="bi bi-trophy"></i>

                <div class="stat-number">
                    0
                </div>

                <div>
                    Tournaments
                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="stat-card">

                <i class="bi bi-people"></i>

                <div class="stat-number">
                    0
                </div>

                <div>
                    Teams
                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="stat-card">

                <i class="bi bi-person"></i>

                <div class="stat-number">
                    0
                </div>

                <div>
                    Players
                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="stat-card">

                <i class="bi bi-broadcast"></i>

                <div class="stat-number">
                    0
                </div>

                <div>
                    Live Matches
                </div>

            </div>

        </div>

    </div>


    <!-- QUICK ACTIONS -->

    <h5 class="mb-3">
        Quick Actions
    </h5>


    <div class="row g-3">


        <div class="col-6 col-md-3">

            <a
                href="tournaments.html"
                class="admin-action"
            >

                <i class="bi bi-plus-circle"></i>

                <span>
                    Tournament
                </span>

            </a>

        </div>


        <div class="col-6 col-md-3">

            <a
                href="admin-teams.html"
                class="admin-action"
            >

                <i class="bi bi-people-fill"></i>

                <span>
                    Teams
                </span>

            </a>

        </div>


        <div class="col-6 col-md-3">

            <a
                href="players.html"
                class="admin-action"
            >

                <i class="bi bi-person-plus"></i>

                <span>
                    Players
                </span>

            </a>

        </div>


        <div class="col-6 col-md-3">

            <a
                href="admin-matches.html"
                class="admin-action"
            >

                <i class="bi bi-calendar-plus"></i>

                <span>
                    Matches
                </span>

            </a>

        </div>


        <div class="col-12">

            <a
                href="scoring.html"
                class="admin-action live-action"
            >

                <i class="bi bi-broadcast"></i>

                <span>
                    LIVE SCORING
                </span>

            </a>

        </div>

    </div>


</main>


<script type="module">

import {
    protectAdminPage,
    logoutUser
} from "./auth.js";


protectAdminPage();


document
    .getElementById("logoutBtn")
    .addEventListener("click", logoutUser);

</script>


</body>
</html>
