<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Teams - Cricket Live</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><nav class="navbar navbar-dark cricket-navbar px-3"><a href="index.html" class="navbar-brand fw-bold">🏏 Cricket Live</a><a href="index.html" class="btn btn-outline-light btn-sm">Home</a></nav><main class="container py-4"><h3 class="fw-bold mb-3">Teams & Players</h3><div id="teamList">Loading...</div></main><nav class="mobile-bottom-nav"><a href="index.html"><i class="bi bi-house"></i><span>Home</span></a><a href="matches.html"><i class="bi bi-calendar2-event"></i><span>Matches</span></a><a href="points.html"><i class="bi bi-trophy"></i><span>Points</span></a><a href="players-stats.html"><i class="bi bi-bar-chart"></i><span>Stats</span></a></nav>
<script type="module">import {db} from './firebase-config.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const out=document.getElementById('teamList');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const [ts,ps]=await Promise.all([getDocs(collection(db,'teams')),getDocs(collection(db,'players'))]);const teams=[];ts.forEach(d=>teams.push({id:d.id,...d.data()}));const players=[];ps.forEach(d=>players.push({id:d.id,...d.data()}));out.innerHTML=teams.length?teams.map(t=>{const tp=players.filter(p=>p.teamId===t.id);return `<div class="card shadow-sm mb-3 p-3"><div class="d-flex align-items-center gap-3">${t.logoUrl?`<img src="${esc(t.logoUrl)}" style="width:60px;height:60px;object-fit:contain;border-radius:12px">`:'<div class="fs-1">🏏</div>'}<div><h5 class="fw-bold mb-0">${esc(t.name)}</h5><small class="text-muted">${esc(t.shortName||'')}</small></div></div><div class="row g-2 mt-3">${tp.length?tp.map(p=>`<div class="col-6 col-md-4"><div class="border rounded-3 p-2 h-100 d-flex align-items-center gap-2">${p.photoUrl?`<img src="${esc(p.photoUrl)}" style="width:45px;height:45px;object-fit:cover;border-radius:50%">`:'<div style="width:45px;height:45px;border-radius:50%;background:#eef2ff;display:grid;place-items:center">🏏</div>'}<div><div class="fw-semibold">${esc(p.name)}</div><small class="text-muted">${esc(p.role||'Player')} ${p.jerseyNumber?`· #${esc(p.jerseyNumber)}`:''}</small></div></div></div>`).join(''):'<div class="text-muted">No players added yet.</div>'}</div></div>`}).join(''):'<div class="alert alert-info">No teams available.</div>'}catch(e){console.error(e);out.innerHTML='<div class="alert alert-danger">Unable to load teams.</div>'}}load();</script></body></html>
