<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4 text-center">

                    <h3 class="fw-bold mb-2">
                        🔐 Create Admin
                    </h3>

                    <p class="text-muted">
                        Temporary admin account setup
                    </p>

                    <div class="alert alert-warning">
                        Delete this file after creating the admin.
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label">Admin Email</label>
                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            value="admin@gmail.com"
                        >
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            value="Admin@123456"
                        >
                    </div>

                    <button
                        id="createAdminBtn"
                        class="btn btn-primary btn-lg w-100"
                    >
                        Create Admin
                    </button>

                    <div id="message" class="mt-3"></div>

                </div>

            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
    auth,
    db
} from "./firebase-config.js";


const button =
    document.getElementById("createAdminBtn");

const message =
    document.getElementById("message");


button.addEventListener("click", async () => {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        message.innerHTML = `
            <div class="alert alert-danger">
                Enter email and password.
            </div>
        `;

        return;
    }


    if (password.length < 6) {

        message.innerHTML = `
            <div class="alert alert-danger">
                Password must contain at least 6 characters.
            </div>
        `;

        return;
    }


    button.disabled = true;

    button.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Creating...
    `;


    try {

        /* Create Firebase Authentication user */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* Create Firestore user document */

        await setDoc(
            doc(db, "users", user.uid),
            {
                name: "Admin",
                email: email,
                role: "admin",
                createdAt: serverTimestamp()
            }
        );


        message.innerHTML = `
            <div class="alert alert-success text-start">

                <strong>✅ Admin created successfully!</strong>

                <hr>

                <div>
                    <strong>Email:</strong>
                    ${email}
                </div>

                <div>
                    <strong>UID:</strong>
                    ${user.uid}
                </div>

                <div>
                    <strong>Role:</strong>
                    admin
                </div>

                <hr>

                You can now go to
                <strong>login.html</strong>
                and login.

            </div>
        `;


        button.innerHTML = "Admin Created";

    } catch (error) {

        console.error(error);

        let errorMessage =
            error.message;


        if (error.code === "auth/email-already-in-use") {

            errorMessage =
                "This email already exists in Firebase Authentication.";

        } else if (error.code === "auth/invalid-email") {

            errorMessage =
                "Invalid email address.";

        } else if (error.code === "auth/weak-password") {

            errorMessage =
                "Password is too weak.";

        } else if (error.code === "permission-denied") {

            errorMessage =
                "Firestore permission denied. Check your Firestore rules.";

        }


        message.innerHTML = `
            <div class="alert alert-danger">
                ❌ ${errorMessage}
            </div>
        `;


        button.disabled = false;
        button.innerHTML = "Create Admin";

    }

});

</script>

</body>
</html>
