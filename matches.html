<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Matches - Cricket Live</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark cricket-navbar px-3"><a href="index.html" class="navbar-brand fw-bold">🏏 Cricket Live</a><a href="index.html" class="btn btn-outline-light btn-sm">Home</a></nav>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h3 class="fw-bold mb-0">Matches</h3><span id="status" class="text-muted small"></span></div><div id="matchList">Loading matches...</div></main>
<nav class="mobile-bottom-nav"><a href="index.html"><i class="bi bi-house"></i><span>Home</span></a><a href="matches.html" class="active"><i class="bi bi-calendar2-event"></i><span>Matches</span></a><a href="points.html"><i class="bi bi-trophy"></i><span>Points</span></a><a href="players-stats.html"><i class="bi bi-bar-chart"></i><span>Stats</span></a></nav>
<script type="module">
import {db} from './firebase-config.js';
import {collection,getDocs,query,orderBy} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const list=document.getElementById('matchList'),status=document.getElementById('status');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(m){const live=m.status==='LIVE'||m.status==='IN_PROGRESS'; const completed=m.status==='COMPLETED'; return `<div class="card shadow-sm mb-3 p-3"><div class="d-flex justify-content-between"><span class="badge ${live?'bg-danger':completed?'bg-success':'bg-primary'}">${live?'🔴 LIVE':esc(m.status||'UPCOMING')}</span><small class="text-muted">${esc(m.date||'')} ${esc(m.time||'')}</small></div><div class="row text-center align-items-center mt-3"><div class="col-5"><div class="fw-bold">${esc(m.teamAName||'Team A')}</div>${live||completed?`<div class="fs-4 fw-bold">${m.teamAScore||0}/${m.teamAWickets||0}</div>`:''}</div><div class="col-2 text-muted fw-bold">VS</div><div class="col-5"><div class="fw-bold">${esc(m.teamBName||'Team B')}</div>${live||completed?`<div class="fs-4 fw-bold">${m.teamBScore||0}/${m.teamBWickets||0}</div>`:''}</div></div><div class="small text-muted mt-2">📍 ${esc(m.venue||'')} · ${esc(m.overs||'')} overs</div><div class="d-flex gap-2 mt-3"><a class="btn btn-dark flex-fill" href="scorecard.html?matchId=${encodeURIComponent(m.id)}">📋 Scorecard</a>${live?`<a class="btn btn-danger flex-fill" href="scorecard.html?matchId=${encodeURIComponent(m.id)}">🔴 Live Score</a>`:''}</div></div>`}
async function load(){try{let snap;try{snap=await getDocs(query(collection(db,'matches'),orderBy('date','desc')))}catch(e){snap=await getDocs(collection(db,'matches'))}let arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));arr.sort((a,b)=>`${b.date||''} ${b.time||''}`.localeCompare(`${a.date||''} ${a.time||''}`));list.innerHTML=arr.length?arr.map(card).join(''):'<div class="alert alert-info">No matches available.</div>';status.textContent=`${arr.length} match${arr.length===1?'':'es'}`;}catch(e){console.error(e);list.innerHTML='<div class="alert alert-danger">Unable to load matches.</div>'}}load();
</script><div class="container pb-4 text-center"><a href="teams-view.html" class="btn btn-outline-primary px-4">👥 Teams & Players</a></div>
</body></html>
