<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Players</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .navbar {
            background: #111827;
        }

        .card {
            border: 0;
            border-radius: 15px;
        }

        .player-photo {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            background: #eee;
        }

    </style>

<link rel="stylesheet" href="style.css">
</head>

<body>


<nav class="navbar navbar-dark px-3">

    <span class="navbar-brand fw-bold">
        🏏 Cricket Admin
    </span>

    <a href="admin.html"
       class="btn btn-outline-light btn-sm">
        Dashboard
    </a>

</nav>


<div class="container py-4">

    <h3 class="fw-bold mb-3">
        Players
    </h3>


    <!-- FORM -->

    <div class="card shadow-sm p-3 mb-4">

        <h5 id="formTitle">
            Add Player
        </h5>


        <form id="playerForm">

            <input type="hidden" id="playerId">


            <div class="mb-3">

                <label class="form-label">
                    Team
                </label>

                <select id="teamId"
                        class="form-select"
                        required>

                    <option value="">
                        Select Team
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Player Name
                </label>

                <input type="text"
                       id="name"
                       class="form-control"
                       placeholder="Anil Kumar"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Player Photo URL
                </label>

                <input type="url"
                       id="photoUrl"
                       class="form-control"
                       placeholder="https://...">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Jersey Number
                </label>

                <input type="number"
                       id="jerseyNumber"
                       class="form-control"
                       min="0">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Player Role
                </label>

                <select id="role"
                        class="form-select">

                    <option value="Batsman">
                        Batsman
                    </option>

                    <option value="Bowler">
                        Bowler
                    </option>

                    <option value="All-Rounder">
                        All-Rounder
                    </option>

                    <option value="Wicket Keeper">
                        Wicket Keeper
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Batting Style
                </label>

                <select id="battingStyle"
                        class="form-select">

                    <option value="">
                        Select
                    </option>

                    <option>Right Hand</option>
                    <option>Left Hand</option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Bowling Style
                </label>

                <input type="text"
                       id="bowlingStyle"
                       class="form-control"
                       placeholder="Right Arm Fast">

            </div>


            <button class="btn btn-primary w-100">
                Save Player
            </button>


            <button type="button"
                    id="cancelEdit"
                    class="btn btn-secondary w-100 mt-2 d-none">

                Cancel Edit

            </button>

        </form>

    </div>


    <!-- PLAYER LIST -->

    <div class="card shadow-sm p-3">

        <h5>Player List</h5>

        <div id="playerList">
            Loading...
        </div>

    </div>

</div>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import { protectAdminPage }
from "./auth.js";

import { CLOUDINARY_CLOUD_NAME, CLOUDINARY_UPLOAD_PRESET } from "./cloudinary-config.js";


protectAdminPage();


let teams = [];

let players = [];


const form =
    document.getElementById("playerForm");

const playerId =
    document.getElementById("playerId");

const teamSelect =
    document.getElementById("teamId");

const playerList =
    document.getElementById("playerList");

const cancelEdit =
    document.getElementById("cancelEdit");


async function loadTeams() {

    const snapshot =
        await getDocs(collection(db, "teams"));

    teams = [];

    teamSelect.innerHTML = `
        <option value="">
            Select Team
        </option>
    `;


    snapshot.forEach(item => {

        const team = {
            id: item.id,
            ...item.data()
        };

        teams.push(team);


        teamSelect.innerHTML += `

            <option value="${team.id}">
                ${team.name}
            </option>

        `;

    });

}


async function loadPlayers() {

    const snapshot =
        await getDocs(collection(db, "players"));

    players = [];


    snapshot.forEach(item => {

        players.push({
            id: item.id,
            ...item.data()
        });

    });


    renderPlayers();

}


function renderPlayers() {

    if (players.length === 0) {

        playerList.innerHTML =
            `<p class="text-muted">
                No players created.
            </p>`;

        return;

    }


    playerList.innerHTML =
        players.map(player => {

            const team =
                teams.find(
                    t => t.id === player.teamId
                );


            return `

            <div class="border rounded-3 p-3 mb-3">

                <div class="d-flex
                            align-items-center
                            gap-3">

                    ${
                        player.photoUrl
                        ?
                        `<img src="${player.photoUrl}"
                              class="player-photo">`
                        :
                        `<div class="player-photo
                                    d-flex
                                    align-items-center
                                    justify-content-center">
                            👤
                        </div>`
                    }


                    <div>

                        <h5 class="mb-1">
                            ${player.name}
                        </h5>

                        <small class="text-muted">
                            ${team?.name || "No Team"}
                        </small>

                        <br>

                        <span class="badge bg-primary">
                            ${player.role || ""}
                        </span>

                    </div>

                </div>


                <div class="mt-3">

                    <small>
                        Jersey:
                        <strong>
                            ${player.jerseyNumber || "-"}
                        </strong>
                    </small>

                    <br>

                    <small>
                        Bat:
                        ${player.battingStyle || "-"}
                    </small>

                    <br>

                    <small>
                        Bowl:
                        ${player.bowlingStyle || "-"}
                    </small>

                </div>


                <div class="d-flex gap-2 mt-3">

                    <button
                        class="btn btn-warning btn-sm"
                        onclick="editPlayer('${player.id}')">

                        Edit

                    </button>


                    <button
                        class="btn btn-danger btn-sm"
                        onclick="deletePlayer('${player.id}')">

                        Delete

                    </button>

                </div>

            </div>

            `;

        }).join("");

}


document.getElementById("uploadPhotoBtn")?.addEventListener("click", async () => {
    const file = document.getElementById("photoFile").files[0];
    const status = document.getElementById("uploadStatus");
    const btn = document.getElementById("uploadPhotoBtn");
    if (!file) { status.textContent = "Choose a photo first."; return; }
    if (CLOUDINARY_CLOUD_NAME.startsWith("YOUR_") || CLOUDINARY_UPLOAD_PRESET.startsWith("YOUR_")) {
        status.textContent = "Set Cloudinary cloud name and unsigned upload preset in cloudinary-config.js first."; return;
    }
    btn.disabled = true; status.textContent = "Uploading...";
    try {
        const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {method:"POST",body:fd});
        const data = await res.json();
        if (!res.ok || !data.secure_url) throw new Error(data.error?.message || "Upload failed");
        document.getElementById("photoUrl").value = data.secure_url;
        status.textContent = "Photo uploaded successfully.";
    } catch(e) { console.error(e); status.textContent = "Upload failed: " + e.message; }
    finally { btn.disabled = false; }
});

form.addEventListener("submit", async e => {

    e.preventDefault();


    const selectedTeam =
        teams.find(
            t => t.id === teamSelect.value
        );


    const data = {

        teamId: teamSelect.value,

        teamName:
            selectedTeam?.name || "",

        name:
            document.getElementById("name")
            .value.trim(),

        photoUrl:
            document.getElementById("photoUrl")
            .value.trim(),

        jerseyNumber:
            Number(
                document.getElementById("jerseyNumber")
                .value
            ),

        role:
            document.getElementById("role")
            .value,

        battingStyle:
            document.getElementById("battingStyle")
            .value,

        bowlingStyle:
            document.getElementById("bowlingStyle")
            .value.trim(),

        updatedAt:
            serverTimestamp()

    };


    try {

        if (playerId.value) {

            await updateDoc(
                doc(db, "players", playerId.value),
                data
            );

            alert("Player updated!");

        } else {

            data.createdAt =
                serverTimestamp();

            await addDoc(
                collection(db, "players"),
                data
            );

            alert("Player created!");

        }


        resetForm();

        loadPlayers();

    } catch (error) {

        console.error(error);

        alert(error.message);

    }

});


window.editPlayer = function(id) {

    const player =
        players.find(
            p => p.id === id
        );

    if (!player) return;


    playerId.value = id;

    teamSelect.value =
        player.teamId || "";

    document.getElementById("name").value =
        player.name || "";

    document.getElementById("photoUrl").value =
        player.photoUrl || "";

    document.getElementById("jerseyNumber").value =
        player.jerseyNumber || "";

    document.getElementById("role").value =
        player.role || "Batsman";

    document.getElementById("battingStyle").value =
        player.battingStyle || "";

    document.getElementById("bowlingStyle").value =
        player.bowlingStyle || "";


    document.getElementById("formTitle").textContent =
        "Edit Player";

    cancelEdit.classList.remove("d-none");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};


window.deletePlayer = async function(id) {

    if (!confirm("Delete this player?"))
        return;


    await deleteDoc(
        doc(db, "players", id)
    );


    loadPlayers();

};


function resetForm() {

    form.reset();

    playerId.value = "";

    document.getElementById("formTitle").textContent =
        "Add Player";

    cancelEdit.classList.add("d-none");

}


cancelEdit.addEventListener(
    "click",
    resetForm
);


await loadTeams();

await loadPlayers();

</script>

</body>
</html>
